services:
  - type: web
    name: gold-calculator-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_FILE
        value: /var/data/bot_data.pkl
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    plan: free